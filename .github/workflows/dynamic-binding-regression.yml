name: Dynamic binding regression
on:
  workflow_dispatch:
  push:
    branches: [p0-vmi-integration-regression]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  dynamic-binding:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test dependency
        run: npm install --no-save --no-package-lock playwright@1.56.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Compile and browser regression
        run: |
          node --test skills/infograph-master/visual-metaphor-intelligence/engine/dynamic-binding-pipeline.test.mjs
          node --test skills/infograph-master/visual-metaphor-intelligence/engine/dynamic-binding-browser.test.mjs
