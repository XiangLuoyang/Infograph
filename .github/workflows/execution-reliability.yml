name: Execution reliability regression
on:
  push:
    branches: ['engineering/v1.3.1-execution-reliability']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/test-execution-reliability.mjs
        env:
          INFOGRAPH_PREVIEW_DIR: ${{ runner.temp }}/infograph-previews
      - run: npm install --no-save --package-lock=false playwright@1.51.1
      - run: npx playwright install --with-deps chromium
      - run: node scripts/test-mixed-browser.mjs
        env:
          INFOGRAPH_PREVIEW_DIR: ${{ runner.temp }}/infograph-previews
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mixed-backend-previews
          path: ${{ runner.temp }}/infograph-previews
          if-no-files-found: error
