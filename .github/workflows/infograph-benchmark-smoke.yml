name: Benchmark native smoke
on:
  workflow_dispatch:
  push:
    paths:
      - 'skills/infograph-master/benchmark/**'
      - '.github/workflows/infograph-benchmark-smoke.yml'
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright@1.51.1
      - run: npx playwright install --with-deps chromium
      - run: node skills/infograph-master/benchmark/test-native-smoke.mjs
        env:
          SMOKE_OUT: ${{ runner.temp }}/infograph-smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-benchmark-smoke
          path: ${{ runner.temp }}/infograph-smoke
          retention-days: 7
