name: Infograph browser QA
on:
  push:
    paths:
      - 'skills/infograph-master/engine/**'
      - 'skills/infograph-master/visual-intelligence/**'
      - '.github/workflows/infograph-browser-qa.yml'
      - 'scripts/build-studios.mjs'
      - 'scripts/verify-studios.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: skills/infograph-master/engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright@1.51.1 pngjs@7.0.0
      - run: npx playwright install --with-deps chromium
      - name: Build standalone studios
        working-directory: .
        run: |
          npm install --no-save --no-package-lock esbuild@0.25.5
          node scripts/build-studios.mjs
          node scripts/verify-studios.mjs
      - run: node contrast-browser-test.mjs
      - run: node layout-browser-test.mjs
      - run: node visual-diff-test.mjs
      - run: node visual-compare-test.mjs
      - run: node browser-qa.mjs
      - run: node studio-browser-qa.mjs
        if: always()
      - run: node studio-browser-qa.mjs --offline
        if: always()
      - run: node master-browser-qa.mjs
        if: always()
      - run: node master-browser-qa.mjs --offline
        if: always()
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: infograph-browser-qa
          path: |
            skills/infograph-master/engine/qa-output/
            dist/studios/
