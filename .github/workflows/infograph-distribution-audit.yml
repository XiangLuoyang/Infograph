name: Infograph distribution audit
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate tracked asset inventory
        run: |
          mkdir -p audit-output
          node scripts/audit-distribution.mjs > audit-output/distribution.json
          node --input-type=module -e "import fs from 'node:fs'; const r=JSON.parse(fs.readFileSync('audit-output/distribution.json')); if(r.revision!==process.env.GITHUB_SHA || r.scanned+r.excluded.length!==r.tracked) throw Error('inventory mismatch'); console.log(JSON.stringify({revision:r.revision,tracked:r.tracked,scanned:r.scanned,excluded:r.excluded,withUrls:r.rows.filter(x=>x.urls.length).length,withMarkers:r.rows.filter(x=>x.markers.length).length},null,2))"
      - name: Audit skill paths and knowledge index (required)
        run: |
          status=0
          node scripts/audit-skill-portability.mjs > audit-output/skill-paths.json || status=1
          node scripts/audit-knowledge-index.mjs > audit-output/knowledge-index.json || status=1
          node --input-type=module -e "import fs from 'node:fs'; for(const f of ['skill-paths','knowledge-index']) {try {const r=JSON.parse(fs.readFileSync('audit-output/'+f+'.json')); console.log(f,JSON.stringify(r.missing??r.issues));} catch(e){console.log(f,e.message)}}"
          exit "$status"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: distribution-inventory
          path: audit-output/
          if-no-files-found: error
