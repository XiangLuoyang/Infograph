name: Infograph engine checks
on:
  push:
    paths:
      - 'docs/consolidation/candidate-trigger.json'
      - 'skills/infograph-master/engine/**'
      - 'skills/infograph-master/visual-intelligence/**'
      - '.github/workflows/infograph-engine-check.yml'
      - 'scripts/**'
      - 'skills/narrative-design/templates/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: skills/infograph-master/engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m unittest test_engine test_compiler
      - run: python engine.py design.example.json
      - run: python compiler.py design.example.json
      - run: node --check visual-check.js

      - run: node test-transforms.mjs

      - run: node test-design-v2.mjs

      - run: node test-hybrid.mjs
      - run: node test-reference-scene.mjs
      - run: node test-reference-surface.mjs
      - run: node test-reference-renderer.mjs
      - run: node test-reference-webgl.mjs
      - run: node test-reference-geometry.mjs
      - run: node test-reference-lighting3d.mjs
      - run: node test-reference-art-direction.mjs
      - run: node test-reference-pair-review.mjs

      - run: node test-integration.mjs
      - run: node test-specialist-ir-adapter.mjs
      - run: node test-conflict-engine.mjs
      - run: node test-resolution-engine.mjs
      - run: node test-unified-compiler.mjs
      - run: node test-specialist-execution.mjs
      - run: node test-task-scheduler.mjs
      - run: node test-parameter-binding.mjs
      - run: node test-design-evidence.mjs
      - run: node test-repair-loop.mjs
      - run: node test-unified-renderer.mjs
      - run: node test-master-engine.mjs
      - run: node test-master-studio-state.mjs
      - run: node test-studio-brief.mjs
      - run: node test-studio-controls.mjs
      - run: node test-studio-preview.mjs
      - run: node test-studio-history.mjs
      - run: node test-artifact-semantic-ir.mjs
      - run: node test-reconstruction.mjs
      - run: node test-execution-gates.mjs
      - run: node test-core-design-principles.mjs
      - run: node test-critique-plan.mjs
      - run: node test-skill-package.mjs

      - name: Visual intelligence tests
        working-directory: skills/infograph-master/visual-intelligence
        run: |
          set -e
          for f in test-*.mjs; do node "$f"; done
      - name: JavaScript syntax checks
        working-directory: skills/infograph-master
        run: find engine visual-intelligence -type f -name '*.mjs' -print0 | xargs -0 -r -n 1 node --check

      - name: Dependency audit self-test
        working-directory: .
        run: node scripts/test-audit-dependencies.mjs
      - name: Static dependency audit
        working-directory: .
        run: node scripts/audit-dependencies.mjs

      - name: Install contract validator
        working-directory: .
        run: python -m pip install jsonschema==4.23.0
      - name: Validate registered contracts
        working-directory: .
        run: python scripts/validate-contracts.py

      - name: Archive Python dependency evidence
        working-directory: .
        run: |
          mkdir -p audit-output
          python scripts/audit-python-dependencies.py > audit-output/python-inventory.json
      - uses: actions/upload-artifact@v4
        with:
          name: python-dependency-inventory
          path: audit-output/python-inventory.json
          if-no-files-found: error
