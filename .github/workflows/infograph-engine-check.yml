name: Infograph engine checks
on:
  push:
    paths:
      - 'skills/infograph-master/engine/**'
      - 'skills/infograph-master/visual-intelligence/**'
      - '.github/workflows/infograph-engine-check.yml'
      - 'scripts/**'
      - 'skills/narrative-design/templates/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: skills/infograph-master/engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m unittest test_engine test_compiler
      - run: python engine.py design.example.json
      - run: python compiler.py design.example.json
      - run: node --check visual-check.js

      - run: node test-transforms.mjs

      - run: node test-design-v2.mjs

      - run: node test-hybrid.mjs

      - run: node test-integration.mjs
      - run: node test-specialist-ir-adapter.mjs
      - run: node test-conflict-engine.mjs
      - run: node test-resolution-engine.mjs
      - run: node test-unified-compiler.mjs
      - run: node test-specialist-execution.mjs
      - run: node test-task-scheduler.mjs

      - name: Visual intelligence tests
        working-directory: skills/infograph-master/visual-intelligence
        run: |
          set -e
          for f in test-*.mjs; do node "$f"; done
      - name: JavaScript syntax checks
        working-directory: skills/infograph-master
        run: find engine visual-intelligence -type f -name '*.mjs' -print0 | xargs -0 -r -n 1 node --check

      - name: Dependency audit self-test
        working-directory: .
        run: node scripts/test-audit-dependencies.mjs
      - name: Static dependency audit
        working-directory: .
        run: node scripts/audit-dependencies.mjs

      - name: Install contract validator
        working-directory: .
        run: python -m pip install jsonschema==4.23.0
      - name: Validate registered contracts
        working-directory: .
        run: python scripts/validate-contracts.py
