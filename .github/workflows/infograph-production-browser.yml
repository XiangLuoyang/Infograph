name: Infograph production browser QA
on:
  push:
    paths:
      - 'scripts/infograph.mjs'
      - 'scripts/execution-*.mjs'
      - 'scripts/test-infograph-artifact.mjs'
      - 'skills/infograph-master/engine/**'
      - '.github/workflows/infograph-production-browser.yml'
  pull_request:
    paths:
      - 'scripts/infograph.mjs'
      - 'scripts/execution-*.mjs'
      - 'scripts/test-infograph-artifact.mjs'
      - 'skills/infograph-master/engine/**'
      - '.github/workflows/infograph-production-browser.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright@1.51.1
        working-directory: skills/infograph-master/engine
      - run: npx playwright install --with-deps chromium
        if: runner.os == 'Linux'
        working-directory: skills/infograph-master/engine
      - run: npx playwright install chromium
        if: runner.os == 'Windows'
        working-directory: skills/infograph-master/engine
      - run: node scripts/test-infograph-artifact.mjs
      - run: node skills/infograph-master/engine/test-art-direction-browser.mjs
