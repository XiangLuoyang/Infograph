<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Blind Review</title><style>body{font:16px system-ui;margin:24px;color:#26332d;background:#f5f5f0}main{max-width:1400px;margin:auto}label{display:block;margin:12px 0}select,input,textarea,button{font:inherit;padding:8px;max-width:100%}section{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px}img{width:100%;border:1px solid #bbb}textarea{width:95%}small{color:#555}</style><main><h1>Blind Review Studio</h1><p>仅使用匿名截图。先独立评分，再比较；不推测模型身份。</p><label>载入 manifest.json <input id="file" type="file" accept=".json"></label><label>截图文件（可多选）<input id="pics" type="file" accept="image/png" multiple></label><label>评审编号 <input id="reviewer"></label><label>任务 <select id="task"></select></label><section id="panels"></section><button id="save">导出当前评分</button><p id="msg" role="status"></p></main><script>
const $=id=>document.getElementById(id),dims=['evidence','narrative','visual','representation','interaction','engineering'];let items=[],urls=new Map();
function render(){const root=$('panels');root.replaceChildren();for(let i=0;i<2;i++){const box=document.createElement('article'),sel=document.createElement('select');for(const x of items.filter(x=>x.task===$('task').value)){const o=new Option(x.id,x.id);sel.add(o)}sel.selectedIndex=Math.min(i,sel.options.length-1);const img=document.createElement('img');img.alt='匿名作品桌面截图';const mobile=document.createElement('img');mobile.alt='匿名作品移动截图';const fields=document.createElement('div');for(const d of dims){const l=document.createElement('label'),s=document.createElement('select');s.dataset.dim=d;s.add(new Option('未评价',''));for(let n=0;n<=5;n++)s.add(new Option(String(n),String(n)));l.append(d+' ',s);fields.append(l)}const note=document.createElement('textarea');note.placeholder='具体缺陷、证据位置或未评价原因';const reset=()=>{for(const s of fields.querySelectorAll('select'))s.value='';note.value='';for(const [el,w] of [[img,1440],[mobile,390]]){const u=urls.get(sel.value+'-'+w+'.png');if(u)el.src=u;else el.removeAttribute('src')}};sel.onchange=reset;box.append(sel,img,mobile,fields,note);root.append(box);reset()}}
$('file').onchange=async()=>{try{const m=JSON.parse(await $('file').files[0].text());if(m.version!=='0.1'||!Array.isArray(m.items)||m.items.some(x=>!(/^[a-f0-9]{24}$/).test(x.id)||!['B02','B03','B07','B10'].includes(x.task)))throw Error('invalid manifest');items=m.items;$('task').replaceChildren(...[...new Set(items.map(x=>x.task))].map(t=>new Option(t,t)));render()}catch(e){$('msg').textContent=e.message}};
$('pics').onchange=()=>{for(const u of urls.values())URL.revokeObjectURL(u);urls=new Map([...$('pics').files].map(f=>[f.name,URL.createObjectURL(f)]));render()};$('task').onchange=render;
$('save').onclick=()=>{const reviewer=$('reviewer').value.trim();if(!reviewer){$('msg').textContent='请输入评审编号';return}const records=[...$('panels').children].map(b=>({id:b.querySelector('select').value,task:$('task').value,scores:Object.fromEntries([...b.querySelectorAll('[data-dim]')].map(s=>[s.dataset.dim,s.value!==''?Number(s.value):null])),note:b.querySelector('textarea').value}));if(records.some(r=>!r.id)||new Set(records.map(r=>r.id)).size!==records.length){$('msg').textContent='请选择两个不同作品';return}const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({version:'0.1',reviewer,records,scope:'screenshots-only'},null,2)],{type:'application/json'}));a.download='blind-review.json';a.click();URL.revokeObjectURL(a.href);$('msg').textContent='已请求导出；未评价项保留为空'};</script></html>
