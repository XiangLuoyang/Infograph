<!doctype html><meta charset="utf-8"><title>Exception queue</title><style>body{font:16px system-ui;margin:24px}th,td{padding:10px;text-align:left}table{border-collapse:collapse}tr{border-bottom:1px solid #ddd}.urgent{font-weight:bold}</style><h1>Open exception queue</h1><label for="filter">Priority</label><select id="filter"><option value="all">All</option><option value="P1">P1</option><option value="P2">P2</option></select><p id="count" aria-live="polite">3 open</p><table id="queue"><tr><th>Priority</th><th>ID</th><th>Owner</th><th>Age</th></tr><tr data-p="P1" class="urgent"><td>P1</td><td>E01</td><td>Team A</td><td>8h</td></tr><tr data-p="P1"><td>P1</td><td>E02</td><td>Team B</td><td>3h</td></tr><tr data-p="P2"><td>P2</td><td>E03</td><td>Team C</td><td>6h</td></tr></table><script>document.querySelector('#filter').onchange=e=>{let n=0;for(const r of document.querySelectorAll('[data-p]')){r.hidden=e.target.value!=='all'&&r.dataset.p!==e.target.value;if(!r.hidden)n++}document.querySelector('#count').textContent=n+' open'}</script>
