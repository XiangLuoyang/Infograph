<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Infograph Engine Gallery</title><style>*{box-sizing:border-box}body{margin:0;font:16px system-ui,sans-serif;background:#f3f2ee;color:#202a28}main{max-width:1150px;margin:auto;padding:24px}h1{font-size:32px}label{display:grid;gap:6px}select,button{font:inherit;padding:9px;border:1px solid #777;background:white;color:#202a28;border-radius:4px}.controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin:24px 0}.preview{padding:24px;background:var(--canvas);color:var(--text);font-family:var(--font);border:1px solid #8885}.content{display:grid;gap:16px;grid-template-columns:var(--columns)}.panel{min-width:0;padding:16px;background:var(--surface);border-radius:var(--radius)}.bar{height:12px;background:var(--accent);margin:5px 0 15px}.caption{font-size:13px}pre{white-space:pre-wrap;overflow-wrap:anywhere}button:focus-visible,select:focus-visible{outline:3px solid #315d91;outline-offset:2px}@media(max-width:650px){.content{grid-template-columns:1fr}main{padding:12px}.preview{padding:12px}}.material-paper{background:var(--surface);border:1px solid #8884}

:"chronology","columns":"1fr","mobile":"1fr"},{"id":"small-multiples","task":"trend-comparison","columns":"repeat(3,minmax(0,1fr))","mobile":"1fr"},{"id":"ledger","task":"lookup","columns":"1fr","mobile":"1fr"}],materials=["paper","glass","parchment","metal","clay","wireframe","matte","ink","grid","layered"],rules=[{"task":"ranking","types":["bar","dot"],"requires":["numeric","category"]},{"task":"deviation","types":["bullet","diverging-bar"],"requires":["actual","target"]},{"task":"trend","types":["line","small-multiples"],"requires":["time","numeric"]},{"task":"composition","types":["stacked-bar","treemap"],"requires":["part","whole"]},{"task":"distribution","types":["histogram","box","ecdf"],"requires":["observations"]},{"task":"relationship","types":["scatter"],"requires":["x","y"]},{"task":"contribution","types":["waterfall"],"requires":["additive"]},{"task":"flow","types":["sankey","alluvial"],"requires":["source","target","weight"]},{"task":"geography-rate","types":["choropleth"],"requires":["geometry","rate"]},{"task":"geography-total","types":["proportional-symbol"],"requires":["coordinates","total"]},{"task":"lookup","types":["table"],"requires":["records"]},{"task":"network","types":["node-link","adjacency-matrix"],"requires":["nodes","edges"]},{"task":"process","types":["flowchart","swimlane"],"requires":["nodes","edges"]},{"task":"assembly","types":["exploded-view","cutaway"],"requires":["parts","geometry"]},{"task":"uncertainty","types":["interval","fan-chart"],"requires":["estimate","bounds"]},{"task":"schedule","types":["gantt","timetable"],"requires":["start","end"]},{"task":"hierarchy","types":["tree","treemap"],"requires":["parent","child"]},{"task":"correlation-matrix","types":["heatmap"],"requires":["matrix"]},{"task":"change-pairs","types":["slopegraph","dumbbell"],"requires":["before","after"]},{"task":"scenario","types":["small-multiples","interactive-model"],"requires":["assumptions","outputs"]}];const $=id=>document.getElementById(id);function options(id,items){for(const v of items){const o=document.createElement('option');o.value=v;o.textContent=v;$(id).append(o)}}options('style',styles.map(x=>x.id));options('layout',layouts.map(x=>x.id));options('material',materials);options('task',rules.map(x=>x.task));let spec;function update(){const s=styles.find(x=>x.id===$('style').value),l=layouts.find(x=>x.id===$('layout').value),m=$('material').value,r=rules.find(x=>x.task===$('task').value);for(const k of ['canvas','surface','text','accent','font'])$('preview').style.setProperty('--'+k,s[k]);$('preview').style.setProperty('--radius',s.radius+'px');$('preview').style.setProperty('--columns',l.columns);$('hero').className='panel material-'+m;$('route').textContent=r.types.join(' / ')+'；需要字段：'+r.requires.join(', ');spec={style:s.id,layout:l.id,material:m,task:r.task,candidates:r.types};$('spec').textContent=JSON.stringify(spec,null,2)}for(const [name,v] of [['泰国',108],['越南',95],['马来西亚',108],['新加坡',105]]){const d=document.createElement('div');d.textContent=name+' '+v+'%';const b=document.createElement('div');b.className='bar';b.style.width=v/120*100+'%';d.append(b);$('bars').append(d)}for(const id of ['style','layout','material','task'])$(id).addEventListener('change',update);$('download').onclick=()=>{const u=URL.createObjectURL(new Blob([JSON.stringify(spec,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=u;a.download='design-selection.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};update();</script></html>
