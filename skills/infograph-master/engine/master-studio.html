<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Infograph Master Studio</title><style>*{box-sizing:border-box}body{margin:0;font:15px system-ui;color:#24382f;background:#f4f5f1}header{padding:24px;border-bottom:1px solid #cbd3cc}main{display:grid;grid-template-columns:260px minmax(0,1fr);gap:24px;padding:24px}section,aside{background:white;padding:20px;border:1px solid #d6ddd5}button{padding:10px;cursor:pointer}iframe{width:100%;height:540px;border:1px solid #d6ddd5}pre{white-space:pre-wrap;overflow-wrap:anywhere}label{display:block;margin:12px 0}input{width:100%}@media(max-width:720px){main{grid-template-columns:1fr;padding:12px}}</style></head><body><header><small>INFOGRAPH / MASTER STUDIO · C07-D</small><h1>统一设计工作台</h1><p>候选原型 · 合成数据 · 未经浏览器验收</p></header><main><aside><h2>业务与汇报需求</h2><label>数据（JSON数组）<textarea id="rows" rows="8" style="width:100%"></textarea></label><label>单位<input id="unit"></label><label>标题<input id="title"></label><label>副标题<input id="subtitle"></label><label>核心结论<textarea id="claim" style="width:100%"></textarea></label><label>限定条件<textarea id="note" style="width:100%"></textarea></label><label><input id="confirm" type="checkbox" style="width:auto"> 我已核对当前数据与结论（非独立验证）</label><pre id="errors" role="alert"></pre><h2>设计状态</h2><label>色相 <input id="hue" type="range" min="0" max="359" value="150"></label><label>色度<input id="chroma" type="range" min="0" max=".2" step=".01"></label><label><input id="dark" type="checkbox" style="width:auto">深色页面</label><label>字体方向<select id="direction"><option>editorial</option><option>swiss</option><option>technical</option></select></label><label>正文字号<input id="base" type="number" min="12" max="24"></label><label>排版密度<select id="density"><option>compact</option><option>normal</option><option>reading</option></select></label><label>材质表面<select id="material"><option>paper</option><option>metal</option><option>stone</option><option>glass</option><option>matte</option></select></label><label>画布宽度<input id="width" type="number" min="320" max="1600"></label><label>画布高度<input id="height" type="number" min="240" max="800"></label><label><input id="live" type="checkbox" style="width:auto" checked> 参数实时预览</label><button id="run" disabled>重新计算</button><p id="status" role="status">加载中</p><p>图形固定为柱状图；材质仅不透明表面；深色页面不改变图形内部配色。</p></aside><section><h2>作品预览</h2><label>预览宽度<select id="viewport"><option value="100%">自适应</option><option value="390px">手机 390px</option><option value="768px">平板 768px</option><option value="1280px">桌面 1280px</option></select></label><div style="overflow:auto"><iframe id="preview" title="设计预览" sandbox></iframe></div><h2>计算状态</h2><pre id="audit"></pre></section></main><script type="module">import {inspectResult,createPreviewScheduler} from './studio-preview.mjs';import {designControls} from './studio-controls.mjs';import {createStudioState} from './master-studio-state.mjs';import {validateBrief,parseRows} from './studio-brief.mjs';import {runMaster} from './master-engine.mjs';const $=id=>document.getElementById(id);try{const res=await fetch('./master-engine.example.json');if(!res.ok)throw Error('fixture unavailable');const initial=await res.json();const state=createStudioState(initial);const controls=designControls(initial);const keys=Object.keys(controls);for(const k of keys){if(k==='dark')$(k).checked=controls[k];else $(k).value=controls[k]}const readControls=()=>designControls(Object.fromEntries(keys.map(k=>[k,k==='dark'?$(k).checked:typeof controls[k]==='number'?($(k).value.trim()===''?NaN:Number($(k).value)):$(k).value])));const fields=['unit','title','subtitle','claim','note'];for(const k of fields)$(k).value=initial[k];$('rows').value=JSON.stringify(initial.rows,null,2);for(const k of [...fields,'rows'])$(k).addEventListener('input',()=>{scheduler.cancel();$('confirm').checked=false;state.edit({claim:''});show()});function show(){const v=state.view();$('status').textContent=v.result?.status??v.status;$('preview').srcdoc=v.result?.html??'';$('audit').textContent=JSON.stringify({version:v.version,status:v.status,inspection:inspectResult(v.result)},null,2)}const scheduler=createPreviewScheduler(()=>{if($('live').checked&&$('confirm').checked)calculate()});$('viewport').addEventListener('change',()=>{$('preview').style.width=$('viewport').value});$('live').addEventListener('change',()=>{if(!$('live').checked)scheduler.cancel()});$('confirm').addEventListener('change',()=>{if(!$('confirm').checked){scheduler.cancel();state.edit({});show()}});for(const k of keys)$(k).addEventListener('input',()=>{state.edit({});show();if($('live').checked&&$('confirm').checked)scheduler.request()});function calculate(){scheduler.cancel();let patch;try{patch=Object.fromEntries(fields.map(k=>[k,$(k).value]));patch.rows=parseRows($('rows').value);const v=validateBrief(patch);if(!v.valid)throw Error(v.errors.join('\n'));if(!$('confirm').checked)throw Error('请核对数据与结论');$('errors').textContent='';state.edit({...patch,...readControls()})}catch(e){$('errors').textContent=String(e.message);return}const {ticket,input}=state.begin();try{state.complete(ticket,runMaster(input))}catch(e){state.fail(ticket);show();$('status').textContent=String(e.message);return}show()}$('run').addEventListener('click',calculate);$('run').disabled=false;show()}catch(e){$('status').textContent=String(e.message)}</script></body></html>
