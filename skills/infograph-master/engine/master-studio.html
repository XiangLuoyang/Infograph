<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Infograph Master Studio</title><style>*{box-sizing:border-box}body{margin:0;font:15px system-ui;color:#24382f;background:#f4f5f1}header{padding:24px;border-bottom:1px solid #cbd3cc}main{display:grid;grid-template-columns:260px minmax(0,1fr);gap:24px;padding:24px}section,aside{background:white;padding:20px;border:1px solid #d6ddd5}button{padding:10px;cursor:pointer}iframe{width:100%;height:540px;border:1px solid #d6ddd5}pre{white-space:pre-wrap;overflow-wrap:anywhere}label{display:block;margin:12px 0}input{width:100%}@media(max-width:720px){main{grid-template-columns:1fr;padding:12px}}</style></head><body><header><small>INFOGRAPH / MASTER STUDIO · C07-A</small><h1>统一设计工作台</h1><p>候选原型 · 合成数据 · 未经浏览器验收</p></header><main><aside><h2>设计状态</h2><label>色相 <input id="hue" type="range" min="0" max="359" value="150"></label><button id="run" disabled>重新计算</button><p id="status" role="status">加载中</p><p>字体、材质、构图、图形：当前使用固定引擎预设。其他控制待接入。</p></aside><section><h2>作品预览</h2><iframe id="preview" title="设计预览" sandbox></iframe><h2>计算状态</h2><pre id="audit"></pre></section></main><script type="module">import {createStudioState} from './master-studio-state.mjs';import {runMaster} from './master-engine.mjs';const $=id=>document.getElementById(id);try{const res=await fetch('./master-engine.example.json');if(!res.ok)throw Error('fixture unavailable');const state=createStudioState(await res.json());function show(){const v=state.view();$('status').textContent=v.result?.status??v.status;$('preview').srcdoc=v.result?.html??'';$('audit').textContent=JSON.stringify({version:v.version,status:v.status,revision:v.result?.repair?.acceptedRevision??null},null,2)}$('hue').addEventListener('input',()=>{state.edit({hue:Number($('hue').value)});show()});$('run').addEventListener('click',()=>{const {ticket,input}=state.begin();try{state.complete(ticket,runMaster(input))}catch(e){state.fail(ticket);show();$('status').textContent=String(e.message);return}show()});$('run').disabled=false;show()}catch(e){$('status').textContent=String(e.message)}</script></body></html>
