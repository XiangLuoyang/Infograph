<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Infograph Color Studio</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f2ee;color:#24312d;font:15px/1.6 system-ui,sans-serif}header,main{max-width:1400px;margin:auto;padding:24px}header{border-bottom:1px solid #c8cec8}h1,h2{line-height:1.2}h1{font:36px Georgia,serif;margin:8px 0}h2{font-size:18px}main{display:grid;grid-template-columns:280px minmax(0,1fr);gap:24px}section,aside{background:white;border:1px solid #d8dcd6;padding:20px;margin-bottom:16px}label{display:block;margin:12px 0}select,input,button{font:inherit;max-width:100%}select,input[type=text]{width:100%;padding:6px}input[type=range]{width:100%}button{padding:8px 12px;cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #315d91;outline-offset:3px}.swatches{display:flex;flex-wrap:wrap;gap:8px}.swatch{flex:1 1 90px;font-size:12px;overflow-wrap:anywhere}.chip{height:42px;border:1px solid #aaa}.preview{padding:24px;border:1px solid #aaa}.preview article{padding:20px;margin-top:16px}.metric{font:48px Georgia,serif}.barrow{display:grid;grid-template-columns:75px minmax(0,1fr) 55px;align-items:center;gap:8px;margin:8px 0}.bar{height:18px}.audit{overflow:auto}table{border-collapse:collapse;width:100%}td,th{text-align:left;padding:6px;border-bottom:1px solid #ddd}pre{white-space:pre-wrap;overflow-wrap:anywhere}small{display:block} @media(max-width:760px){main{grid-template-columns:1fr;padding:12px}header{padding:12px}.metric{font-size:36px}}</style><header><small>INFOGRAPH / VISUAL INTELLIGENCE / V1.2</small><h1>Color Studio</h1><p>Atmosphere · Semantic encoding · Context · Audit</p></header><main><aside><h2>设计参数</h2><label>候选主题<select id="preset"></select></label><label>色相 <output id="hval"></output><input id="hue" type="range" min="0" max="359" value="160"></label><label>彩度 <output id="cval"></output><input id="chroma" type="range" min="0" max=".2" step=".01" value=".08"></label><label>和谐关系<select id="harmony"><option>monochrome</option><option selected>analogous</option><option>complementary</option><option>split</option><option>triadic</option><option>neutralAccent</option></select></label><label><input id="dark" type="checkbox"> 深色主题</label><label>品牌色（可选）<input id="brand" type="text" placeholder="#285c42"></label><label>表达目的<select id="intent"><option>executive</option><option>monitor</option><option>explore</option></select></label><label>数据关系<select id="relation"><option>ranking</option><option>category</option><option>magnitude</option><option>deviation</option><option>status</option></select></label><label>色觉模拟<select id="vision"><option>normal</option><option>protan</option><option>deutan</option><option>tritan</option></select></label><label>表面不透明度<input id="alpha" type="range" min="0" max="100" value="100"></label><button id="export">导出 JSON 契约</button><p id="error" role="alert"></p></aside><div><section><h2>01 / 氛围色</h2><div id="tokens" class="swatches"></div></section><section><h2>02 / 语义色</h2><p id="encoding"></p><div id="semantic" class="swatches"></div><small id="semanticNote"></small></section><section><h2>03 / 情境预演</h2><div id="preview" class="preview"></div><small>合成数据；模拟仅作用于色彩，不是临床或无障碍认证。</small></section><section><h2>04 / 色彩审计</h2><div class="audit" id="audit"></div></section><section><h2>05 / 设计契约</h2><pre id="contract"></pre></section><section><h2>06 / 设计模式</h2><div id="cases"></div></section></div></main><script type="module">
import {studioOutput} from "./studio-output.mjs";
import {palette,sequential,contrast} from './color.mjs';
import {categorical,diverging,simulate,auditCategories} from './semantic-color.mjs';
import {artPalette,composite} from './color-art.mjs';
import {colorPlan} from './color-decision.mjs';
const $=id=>document.getElementById(id);
import p from './palettes.json' with {type:'json'};
import a from './art-palettes.json' with {type:'json'};
import c from './color-cases.json' with {type:'json'};
import d from './color-cross-domain.json' with {type:'json'};
const el=(tag,text,parent)=>{const n=document.createElement(tag);n.textContent=text;parent.append(n);return n};
const swatches=(id,items)=>{$(id).replaceChildren();for(const [name,color] of items){const w=el('div','',$(id));w.className='swatch';const c=el('div','',w);c.className='chip';c.style.background=color;el('span',name+' '+color,w)}};
let current=null,presets=[],cache=new Map();
function render(){try{current=null;$('export').disabled=true;const hue=+$('hue').value,chroma=+$('chroma').value,dark=$('dark').checked,brand=$('brand').value.trim()||null,relation=$('relation').value,vision=$('vision').value,alpha=+$('alpha').value/100;
$('hval').value=hue;$('cval').value=chroma;
const a=artPalette({hue,chroma,dark,brand,harmony:$('harmony').value}),t=a.tokens,plan=colorPlan({intent:$('intent').value,relationship:relation,categoryCount:6,domain:relation==='deviation'?[-30,30]:relation==='magnitude'?[0,120]:null,center:relation==='deviation'?0:null,brand});
const surface=composite(t.surface,t.canvas,alpha);let colors,labels,values=[108,95,107.7,105,90,80],note='';
if(relation==='category'){if(!cache.has(surface))cache.set(surface,categorical({background:surface}));colors=cache.get(surface).colors;labels=values.map((_,i)=>'Category '+(i+1));note='最小模拟色差 '+auditCategories(colors).min.toFixed(4)+'；无通用合格阈值。'}
else if(relation==='magnitude'){colors=sequential({hue,chroma,count:7});labels=['0','20','40','60','80','100','120'];}
else if(relation==='deviation'){colors=diverging();labels=['-30','-20','-10','0','+10','+20','+30'];}
else if(relation==='status'){colors=[t.muted,t.primary];labels=['未知 / 待核实','已核实'];note='未提供业务风险阈值，不自动判断好坏。'}
else{colors=[t.muted,t.primary];labels=['其他','焦点'];}
const sim=c=>simulate(c,vision);swatches('tokens',Object.entries(t).map(([k,c])=>[k,sim(c)]));swatches('semantic',colors.map((c,i)=>[labels[i],sim(c)]));$('encoding').textContent=plan.atmosphere+' / '+plan.encoding;$('semanticNote').textContent=note;
const p=$('preview');p.replaceChildren();p.style.background=sim(t.canvas);p.style.color=sim(t.text);el('small','REGIONAL REVIEW / SYNTHETIC',p);el('div','101.9%',p).className='metric';el('p','Revenue attainment · efficiency unverified',p);const panel=el('article','',p);panel.style.background=sim(surface);
values.forEach((v,i)=>{const row=el('div','',panel);row.className='barrow';el('span',['TH','VN','MY','SG','KH','MM'][i],row);const track=el('div','',row),bar=el('div','',track);bar.className='bar';bar.style.width=v/120*100+'%';const index=relation==='category'?i:relation==='magnitude'?Math.round(v/20):relation==='deviation'?Math.max(0,Math.min(6,Math.round((v-100+30)/10))):relation==='status'?0:i===0?1:0;bar.style.background=sim(colors[index]);el('span',v+'%',row)});
const rows=[...a.audit.map(x=>({role:x.role,bg:x.bg,ratio:x.ratio})),...['text','muted','primary','highlight'].map(role=>({role,bg:'composited',ratio:contrast(t[role],surface)}))];const table=document.createElement('table');$('audit').replaceChildren(table);const head=el('tr','',table);['Role','Surface','Ratio','Normal text'].forEach(x=>el('th',x,head));rows.forEach(x=>{const tr=el('tr','',table);[x.role,x.bg,x.ratio.toFixed(2),x.ratio>=4.5?'PASS':'RESTRICT'].forEach(v=>el('td',v,tr))});
current={version:'color-studio-1',parameters:{hue,chroma,dark,brand,harmony:$('harmony').value,alpha,vision,relation,intent:$('intent').value},plan,tokens:t,semantic:{colors,labels},surface,audit:rows,scope:'opaque sRGB text and single composited backdrop; no browser or perceptual certification'};$('contract').textContent=JSON.stringify(current,null,2);$('error').textContent='';$('export').disabled=false;
}catch(e){$('error').textContent=e.message;$('contract').textContent='Invalid design; export disabled.'}}
async function init(){presets=[...p,...a];presets.forEach((x,i)=>{const o=el('option',x.id,$('preset'));o.value=i});$('preset').addEventListener('change',()=>{const x=presets[+$('preset').value];$('hue').value=x.hue;$('chroma').value=x.chroma;$('dark').checked=x.dark;$('harmony').value=x.harmony||'monochrome';render()});for(const id of ['hue','chroma','dark','harmony','brand','intent','relation','vision','alpha'])$(id).addEventListener('input',render);for(const x of [...c,...d]){const p=el('p',x.id+' · '+x.name,$('cases'));const a=el('a',' Source',p);a.href=x.source;a.rel='noopener noreferrer';a.target='_blank'}$('export').addEventListener('click',()=>{if(!current)return;const url=URL.createObjectURL(new Blob([JSON.stringify(studioOutput('color',current),null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='infograph-color-contract.json';a.click();URL.revokeObjectURL(url)});render()}
init().catch(e=>{$('error').textContent=e.message;$('export').disabled=true});
</script></html>
