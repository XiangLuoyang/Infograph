<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Composition Studio</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f4ee;color:#233b31;font:15px system-ui,sans-serif}header,main{max-width:1400px;margin:auto;padding:24px}main{display:grid;grid-template-columns:280px minmax(0,1fr);gap:24px}main>aside,main>section{min-width:0}aside{display:grid;grid-template-columns:minmax(0,1fr);gap:12px;align-content:start}label{display:grid;grid-template-columns:minmax(0,1fr);gap:5px;min-width:0}#description{overflow-wrap:anywhere}select,input,button{font:inherit;min-width:0;max-width:100%;padding:6px}svg{width:100%;height:auto;background:#fff}pre{white-space:pre-wrap;overflow-wrap:anywhere}button{cursor:pointer}small{color:#526b5c}@media(max-width:760px){main{grid-template-columns:minmax(0,1fr)}} </style><header><small>INFOGRAPH / VISUAL INTELLIGENCE</small><h1>Composition Studio</h1><p>语义候选、矩形布局与注意力实验。候选原型不等于已实现的几何模板。</p></header><main><aside><label>表达目标<select id="goal"><option value="supports">主张与证据</option><option value="peer">同级比较</option><option value="partOf">整体与部分</option><option value="contrasts">对照</option></select></label><label>原型图谱<select id="atlas"></select></label><p id="description"></p><label>几何模板<select id="layout"><option value="row">主从横向</option><option value="column">主从纵向</option></select></label><label>画布<select id="device"><option value="desktop">桌面</option><option value="mobile">窄屏</option></select></label><label>主体权重<input id="weight" type="range" min="1" max="5" value="2"></label><label>边距<input id="margin" type="range" min="8" max="48" value="24"></label><label>间距<input id="gap" type="range" min="4" max="32" value="16"></label><label>视觉修饰<select id="modifier"><option value="base">基础</option><option value="quiet">上下文降噪</option><option value="focus">局部强调</option></select></label><label>阅读焦点<select id="focus"><option value="headline">结论</option><option value="evidence">证据</option><option value="context">背景</option></select></label><button id="export" disabled>导出设计计划 JSON</button></aside><section><p id="status" role="status"></p><svg id="preview" role="img" aria-label="构图几何预览"></svg><p>合成示例：销售达成101.9%，实际326M / 目标320M，库存86K。非真实业务数据。</p><h2>语义候选与注意力计划</h2><pre id="plan"></pre></section></main><script type="module">
import {studioOutput} from "./studio-output.mjs";
import catalog from './composition-archetypes.json' with {type:'json'};
import {solveComposition} from './parametric-composition.mjs';
import {deriveComposition} from './information-composition.mjs';
import {attentionPlan} from './attention-plan.mjs';
const $=id=>document.getElementById(id),ns='http://www.w3.org/2000/svg';let output=null;
try{

for(const c of catalog){const o=document.createElement('option');o.value=c.id;o.textContent=c.name||c.label||c.id;$('atlas').append(o)}
const labels={headline:'区域达成率 101.9%',evidence:'实际326M / 目标320M',context:'库存86K'};
function render(){output=null;$('export').disabled=true;$('preview').replaceChildren();$('plan').textContent='';try{
const goal=$('goal').value,chosen=catalog.find(c=>c.id===$('atlas').value);$('description').textContent=JSON.stringify(chosen);
const nodes=Object.entries(labels).map(([id,label])=>({id,label}));const endpoints={supports:['evidence','headline'],peer:['headline','evidence'],partOf:['evidence','headline'],contrasts:['headline','evidence']};
// Use separate explicitly synthetic semantic example; not a claim that unlike metrics are peers or parts.
const semantic=deriveComposition({goal,nodes:[{id:'a',label:'示例对象 A'},{id:'b',label:'示例对象 B'}],edges:[{from:'a',to:'b',type:goal,evidence:'synthetic-relation-demo'}]},catalog);
const mobile=$('device').value==='mobile',input={width:mobile?420:1000,height:mobile?900:620,margin:+$('margin').value,gap:+$('gap').value,root:{id:'page',axis:'column',children:[{id:'headline',weight:1,minHeight:100},{id:'body',weight:3,axis:$('layout').value,children:[{id:'evidence',weight:+$('weight').value,minWidth:100,minHeight:80},{id:'context',weight:1,minWidth:100,minHeight:80}]}]}};
const geometry=solveComposition(input),focus=$('focus').value,modifier=$('modifier').value;
const attention=attentionPlan({blocks:nodes.map(n=>({id:n.id,essential:true,initiallyVisible:true})),steps:[{action:'anchor',target:focus,question:'当前阅读重点？'}],mode:'explore'});
const svg=$('preview');svg.setAttribute('viewBox','0 0 '+input.width+' '+input.height);
function el(tag,attrs,txt){const e=document.createElementNS(ns,tag);for(const [k,v] of Object.entries(attrs))e.setAttribute(k,v);if(txt)e.textContent=txt;svg.append(e)}
for(const b of geometry.boxes.filter(b=>b.leaf)){const active=b.id===focus,fill=active?'#345b48':modifier==='quiet'?'#ffffff':'#dce4d9';el('rect',{x:b.x,y:b.y,width:b.width,height:b.height,fill,stroke:modifier==='focus'&&active?'#a67c42':'#9caf9f','stroke-width':modifier==='focus'&&active?4:1});el('text',{x:b.x+10,y:b.y+25,fill:active?'#fff':'#233b31','font-size':Math.min(16,(b.width-20)/labels[b.id].length)},labels[b.id])}
output={semantic,selectedArchetype:chosen.id,geometryInput:input,geometry,modifier,attention,limitations:['semantic example independent of preview','manual geometry template','no text measurement']};$('plan').textContent=JSON.stringify({candidates:semantic.candidates.map(c=>c.id),attention},null,2);$('status').textContent='几何计算成功；原型候选与模板独立选择。';$('export').disabled=false;
}catch(e){$('status').textContent=e.message}}
for(const id of ['goal','atlas','layout','device','weight','margin','gap','modifier','focus'])$(id).addEventListener('input',render);
$('export').addEventListener('click',()=>{if(!output)return;const url=URL.createObjectURL(new Blob([JSON.stringify(studioOutput('composition',output),null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='composition-plan.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)});render();
}catch(e){$('status').textContent=e.message}
</script></html>
