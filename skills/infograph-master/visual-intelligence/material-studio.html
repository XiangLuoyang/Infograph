<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Infograph Material Studio</title><style>*{box-sizing:border-box}body{margin:0;background:#e8ebe6;color:#263b32;font:15px system-ui,sans-serif}header{padding:24px;border-bottom:1px solid #aab8ae}h1{font:32px Georgia,serif;margin:0}main{display:grid;grid-template-columns:minmax(230px,300px) minmax(0,1fr);gap:24px;padding:24px;max-width:1200px;margin:auto}aside{display:grid;gap:10px;align-content:start}label{display:grid;gap:4px}select,input,button{font:inherit;max-width:100%;padding:7px}button{cursor:pointer}#preview{padding:clamp(16px,4vw,48px);min-height:460px;overflow-wrap:anywhere}#frame{display:grid;padding:12px;grid-template-columns:repeat(2,minmax(0,1fr))}#frame section,#overlay{padding:16px}strong.metric{display:block;font:clamp(28px,5vw,52px) Georgia,serif;font-variant-numeric:tabular-nums}#overlay{margin-top:16px}#status{white-space:pre-wrap;font-size:13px}small{display:block} @media(max-width:650px){main{grid-template-columns:1fr;padding:12px}#frame{grid-template-columns:1fr}}</style><header><h1>Material Studio</h1><small>Infograph / Visual Intelligence · 合成数据</small></header><main><aside id="controls"></aside><div><article id="preview"><small>REGIONAL BUSINESS REVIEW</small><h2>Growth and inventory</h2><p>区域销售达成与库存分布</p><div id="frame"><section class="data"><small>销售目标达成率</small><strong class="metric">101.9%</strong>326M / 320M</section><section class="data"><small>区域库存</small><strong class="metric">86K</strong>合成数据</section></div><section id="overlay"><small>泰国库存占比</small><strong class="metric">41.9%</strong>36K / 86K</section></article><pre id="status" role="status"></pre><button id="export">导出 JSON</button></div></main><script type="module">
import {renderMaterial} from './material-renderer.mjs';
import {materialComposition} from './material-composition.mjs';
import {industrialPlan} from './industrial-plan.mjs';
const catalog=[
  {
    "id": "brushed-aluminum",
    "substance": "metal",
    "finish": "brushed",
    "bg": "#c5cdd0",
    "ink": "#24343b",
    "shine": 0.45
  },
  {
    "id": "bead-blasted-metal",
    "substance": "metal",
    "finish": "blasted",
    "bg": "#b8c0c2",
    "ink": "#25353a",
    "shine": 0.12
  },
  {
    "id": "polished-steel",
    "substance": "metal",
    "finish": "polished",
    "bg": "#d6dde0",
    "ink": "#26343b",
    "shine": 0.8
  },
  {
    "id": "anodized-metal",
    "substance": "metal",
    "finish": "anodized",
    "bg": "#56676b",
    "ink": "#ffffff",
    "shine": 0.25
  },
  {
    "id": "clear-glass",
    "substance": "glass",
    "finish": "clear",
    "bg": "#eaf2f1",
    "ink": "#233b35",
    "shine": 0.7
  },
  {
    "id": "frosted-glass",
    "substance": "glass",
    "finish": "frosted",
    "bg": "#e0eae6",
    "ink": "#233b35",
    "shine": 0.2
  },
  {
    "id": "matte-polymer",
    "substance": "polymer",
    "finish": "matte",
    "bg": "#d8ddd7",
    "ink": "#293b31",
    "shine": 0.08
  },
  {
    "id": "glazed-ceramic",
    "substance": "ceramic",
    "finish": "glazed",
    "bg": "#f0eee5",
    "ink": "#343b35",
    "shine": 0.45
  }
];
const presets={"editorial":["paper","matte","bead-blasted-metal","glass"],"architectural":["stone","matte","frosted-glass","glass"],"instrument":["metal","matte","anodized-metal","matte"],"archive":["paper","paper","matte-polymer","paper"]};
function studioPlan(p){const base=renderMaterial({material:p.base,detail:p.detail,backend:p.backend,seed:p.seed,strength:p.strength});const primary=renderMaterial({material:p.primary});const overlay=renderMaterial({material:p.overlay});const industrial=industrialPlan({preset:p.frame,edge:p.edge,assembly:p.assembly,texture:p.strength,gap:p.gap},catalog);const composition=materialComposition({surfaces:[{id:'base',role:'foundation',material:p.base,area:1,essential:false,translucent:false},{id:'data',role:'primary',material:p.primary,area:.5,essential:true,translucent:false},{id:'frame',role:'secondary',material:p.frame,area:.6,essential:false,translucent:false},...(p.showOverlay?[{id:'detail',role:'secondary',material:p.overlay,area:.1,essential:true,translucent:false}]:[])],relations:p.showOverlay?[{from:'detail',to:'data',type:'adjacent'}]:[]});return {profile:p,base,primary,overlay,industrial,composition,lighting:{x:Math.round(Math.cos(p.angle*Math.PI/180)*p.shadow),y:Math.round(Math.sin(p.angle*Math.PI/180)*p.shadow)}};}
const defaults={base:'paper',primary:'matte',frame:'bead-blasted-metal',overlay:'glass',detail:'texture',backend:'auto',seed:42,strength:.3,edge:'rounded',assembly:'inset',gap:8,angle:45,shadow:6,showOverlay:true};
let p={...defaults};const el=id=>document.getElementById(id);const controls=el('controls');const fields={base:['paper','metal','stone','glass','matte'],primary:['paper','metal','stone','glass','matte'],frame:catalog.map(x=>x.id),overlay:['paper','metal','stone','glass','matte'],detail:['surface','texture','optical','3d'],backend:['auto','css','svg','canvas','webgl'],edge:['square','chamfer','rounded'],assembly:['flush','inset','stacked','seamed']};const labels={base:'基底',primary:'主体',frame:'工业框架',overlay:'详情表面',detail:'表达需求',backend:'渲染后端',edge:'边缘',assembly:'装配',seed:'随机种子',strength:'纹理强度',gap:'间距',angle:'阴影方向',shadow:'阴影偏移',showOverlay:'显示详情'};const inputs={};function add(k,node){const l=document.createElement('label');l.textContent=labels[k]||k;l.append(node);controls.append(l);inputs[k]=node;node.addEventListener('input',()=>{p[k]=node.type==='checkbox'?node.checked:node.type==='range'||node.type==='number'?Number(node.value):node.value;draw()})}const preset=document.createElement('select');for(const k of Object.keys(presets)){preset.add(new Option(k,k))}controls.append(preset);preset.onchange=()=>{const v=presets[preset.value];Object.assign(p,{base:v[0],primary:v[1],frame:v[2],overlay:v[3]});sync();draw()};for(const [k,opts] of Object.entries(fields)){const s=document.createElement('select');opts.forEach(v=>s.add(new Option(v,v)));add(k,s)}for(const [k,min,max,step] of [['seed',0,1000,1],['strength',0,1,.05],['gap',0,32,1],['angle',0,360,5],['shadow',0,16,1]]){const s=document.createElement('input');s.type='range';s.min=min;s.max=max;s.step=step;add(k,s)}const cb=document.createElement('input');cb.type='checkbox';add('showOverlay',cb);function sync(){for(const [k,n] of Object.entries(inputs)){if(n.type==='checkbox')n.checked=p[k];else n.value=p[k]}}function apply(n,r){Object.assign(n.style,r.css);n.style.backgroundImage=r.svg?'url("data:image/svg+xml,'+encodeURIComponent(r.svg)+'")':(r.css.backgroundImage||'none');n.style.backgroundSize=r.svg?'160px 100px':'auto'}function draw(){const r=studioPlan(p);apply(el('preview'),r.base);Object.assign(el('frame').style,r.industrial.css);el('frame').style.filter='drop-shadow('+r.lighting.x+'px '+r.lighting.y+'px 8px #0002)';document.querySelectorAll('.data').forEach(n=>apply(n,r.primary));apply(el('overlay'),r.overlay);el('overlay').hidden=!p.showOverlay;el('status').textContent=[r.base.requested+' → '+r.base.actual,r.base.requirementMet?'基础需求满足':'需求未满足',...r.base.warnings,...r.industrial.warnings,...r.composition.warnings].join('\n')}el('export').onclick=()=>{const url=URL.createObjectURL(new Blob([JSON.stringify(studioPlan(p),null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='material-profile.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};sync();draw();</script></html>
