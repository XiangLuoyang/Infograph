<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Infograph · Representation Studio</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f4ef;color:#243b30;font:14px system-ui}header,main{max-width:1200px;margin:auto;padding:24px}header{border-bottom:1px solid #cbd3ca}h1{font-size:28px;margin:8px 0}small{color:#526b5c}main{display:grid;grid-template-columns:minmax(230px,1fr) minmax(0,2fr);gap:24px}section{background:white;padding:20px;border:1px solid #d4dbd1;border-radius:8px;min-width:0}label{display:block;margin:12px 0 4px}input,select,textarea,button{font:inherit;padding:8px;border:1px solid #a9b9ab;border-radius:4px;max-width:100%}input,select,textarea{width:100%}textarea{height:180px;font-family:monospace}button{cursor:pointer;background:#345b48;color:white;margin:6px 6px 6px 0}button:disabled{opacity:.5;cursor:default}pre{white-space:pre-wrap;overflow-wrap:anywhere}#preview svg{width:100%;height:auto}#catalog{max-height:220px;overflow:auto}li{margin:5px 0} @media(max-width:700px){main{grid-template-columns:1fr;padding:12px}header{padding:16px}}</style><header><small>INFOGRAPH / VISUAL INTELLIGENCE</small><h1>Representation Studio</h1><p>630 条目录 · 任务选择 · 输入声明 · 原生 SVG 预览</p></header><main><section><label for="task">认知任务</label><select id="task"></select><label for="fields">可用输入（逗号分隔）</label><input id="fields"><label for="candidate">候选表达</label><select id="candidate"></select><label for="data">实际输入 JSON（示例为合成数据）</label><textarea id="data"></textarea><button id="run">检查并渲染</button><label for="search">目录检索</label><input id="search" placeholder="中文、英文或 VIZ-ID"><ul id="catalog"></ul></section><section><h2>输出与验收</h2><p id="status" role="status" aria-live="polite"></p><div id="preview"></div><pre id="audit"></pre><button id="json">导出检查 JSON</button><button id="svg" disabled>导出 SVG</button><p><small>声明检查不等于数据真实性验证；未执行浏览器视觉验收。</small></p></section></main><script type="module">import index from './representation-index.json' with {type:'json'};import {selectRepresentation} from './representation-selector.mjs';import {studioRun} from './representation-studio-core.mjs';
const $=id=>document.getElementById(id);const tasks=[...new Set(index.flatMap(x=>x.routes.map(r=>r.relation+' / '+r.task)))];let result=null;for(const t of tasks)$('task').add(new Option(t,t));const presets={magnitude:{fields:'category,value,unit',data:{unit:'K',rows:[{label:'Thailand',value:18},{label:'Vietnam',value:16}]}},temporal:{fields:'time,value,unit',data:{unit:'K',rows:[{label:'Jan',time:1,value:8},{label:'Mar',time:3,value:18}]}},network:{fields:'nodes,edges',data:{nodes:['A','B','C'],edges:[{source:'A',target:'B'}]}}};function request(){const [relation,task]=$('task').value.split(' / ');return {relation,task,available:$('fields').value.split(',').map(s=>s.trim()).filter(Boolean),limit:100}}function invalidate(){result=null;$('preview').replaceChildren();$('audit').textContent='';$('status').textContent='输入已变化，请重新检查';$('svg').disabled=true;$('json').disabled=true}function candidates(){invalidate();const s=selectRepresentation(index,request()),old=$('candidate').value;$('candidate').replaceChildren();for(const x of [...s.ready,...s.blocked])$('candidate').add(new Option(x.names.zh+' · '+x.status,x.id));if([...$('candidate').options].some(o=>o.value===old))$('candidate').value=old}function preset(){const p=presets[request().relation];$('fields').value=p?.fields||'';$('data').value=JSON.stringify(p?.data||{},null,2);candidates()}$('task').onchange=preset;$('fields').oninput=candidates;$('candidate').onchange=invalidate;$('data').oninput=invalidate;$('run').onclick=()=>{try{result=studioRun(index,request(),$('candidate').value,JSON.parse($('data').value));$('status').textContent=result.status;$('preview').innerHTML=result.status==='rendered'?result.svg:'';$('audit').textContent=JSON.stringify({...result,svg:undefined},null,2);$('svg').disabled=result.status!=='rendered';$('json').disabled=false}catch(e){invalidate();$('status').textContent=e.message}};function download(name,value,type){const url=URL.createObjectURL(new Blob([value],{type})),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}$('json').onclick=()=>{if(result)download('representation-audit.json',JSON.stringify({request:request(),id:$('candidate').value,data:JSON.parse($('data').value),result},null,2),'application/json')};$('svg').onclick=()=>{if(result?.svg)download('representation.svg',result.svg,'image/svg+xml')};function search(){const q=$('search').value.trim().toLowerCase();$('catalog').replaceChildren();const matches=index.filter(x=>[x.id,x.names.en,x.names.zh].some(s=>s.toLowerCase().includes(q)));const info=document.createElement('li');info.textContent=matches.length+' matches (first 30)';$('catalog').append(info);for(const x of matches.slice(0,30)){const li=document.createElement('li');li.textContent=x.id+' '+x.names.zh+' / '+x.names.en+' · '+(x.routes.length?'routed':'review required');$('catalog').append(li)}}$('search').oninput=search;$('task').value='magnitude / compare';preset();search();</script></html>
