<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Spatial Motion Lab</title><style>*{box-sizing:border-box}body{font:16px system-ui;background:#edf1eb;color:#29483a;padding:20px}main{max-width:850px;margin:auto}#stage{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}button.market{background:#d5e2d8;color:#29483a;border:1px solid #a2b5a8;padding:18px;text-align:left;min-height:100px;font:inherit;cursor:pointer}button.market strong{display:block;font:32px Georgia}.focus button.selected{grid-column:1/-1;background:#426b58;color:white;min-height:180px}button:focus-visible{outline:3px solid #ad7135}@media(max-width:500px){#stage{grid-template-columns:repeat(2,minmax(0,1fr))}}</style><main><h1>Spatial Motion Lab</h1><p>合成库存数据 · 点击国家进入详情</p><button id="back">返回区域</button><label><input type="checkbox" id="reduce">减少运动</label><div id="stage"></div><p id="detail" aria-live="polite">区域库存 86K</p></main><script>function flipTransform(a,b){for(const r of [a,b])if(!r||!['x','y','width','height'].every(k=>Number.isFinite(r[k]))||r.width<=0||r.height<=0)throw Error('invalid rectangle');return {dx:a.x-b.x,dy:a.y-b.y,sx:a.width/b.width,sy:a.height/b.height}}
function sharedTransitions(a,b){function index(xs){const m=new Map();for(const x of xs){if(typeof x.id!=='string'||!x.id.trim()||m.has(x.id))throw Error('invalid identity');flipTransform(x,x);m.set(x.id,x)}return m}const x=index(a),y=index(b);return {shared:[...y].filter(([id])=>x.has(id)).map(([id,r])=>({id,...flipTransform(x.get(id),r)})),enter:[...y.keys()].filter(id=>!x.has(id)),exit:[...x.keys()].filter(id=>!y.has(id))}}
function playFlip(el,a,b,{duration=400,reducedMotion=false}={}){if(!Number.isFinite(duration)||duration<0||duration>10000)throw Error('invalid duration');const {dx,dy,sx,sy}=flipTransform(a,b);if(reducedMotion||duration===0)return null;return el.animate([{transformOrigin:'0 0',transform:'translate('+dx+'px,'+dy+'px) scale('+sx+','+sy+')'},{transformOrigin:'0 0',transform:'none'}],{duration,easing:'cubic-bezier(.4,0,.2,1)'})}
const data=[['TH','泰国',36],['VN','越南',20],['MY','马来西亚',12],['SG','新加坡',6],['KH','柬埔寨',7],['MM','缅甸',5]],stage=document.getElementById('stage'),detail=document.getElementById('detail'),reduce=document.getElementById('reduce');let active=null;const nodes=new Map(),animations=new Map();function rect(n){const r=n.getBoundingClientRect();return {x:r.x,y:r.y,width:r.width,height:r.height}}for(const [id,name,v] of data){const b=document.createElement('button');b.className='market';b.setAttribute('aria-pressed','false');b.innerHTML='<span>'+name+'</span><strong>'+v+'K</strong>';b.onclick=()=>change(active===id?null:id);nodes.set(id,b);stage.append(b)}function change(id){const first=new Map([...nodes].map(([k,n])=>[k,rect(n)]));for(const a of animations.values())a.cancel();animations.clear();active=id;stage.classList.toggle('focus',!!id);for(const [k,n] of nodes){n.classList.toggle('selected',k===id);n.setAttribute('aria-pressed',String(k===id))}if(id)stage.prepend(nodes.get(id));else for(const [k] of data)stage.append(nodes.get(k));const last=new Map([...nodes].map(([k,n])=>[k,rect(n)]));const reduced=reduce.checked||matchMedia('(prefers-reduced-motion: reduce)').matches;for(const [k,n] of nodes){const a=playFlip(n,first.get(k),last.get(k),{reducedMotion:reduced});if(a)animations.set(k,a)}const d=data.find(x=>x[0]===id);detail.textContent=d?d[1]+'库存 '+d[2]+'K，占区域 '+(d[2]/86*100).toFixed(1)+'%':'区域库存 86K'}document.getElementById('back').onclick=()=>change(null);reduce.onchange=()=>{if(reduce.checked){for(const a of animations.values())a.cancel();animations.clear()}};</script></html>
