<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Typography Studio</title><style>*{box-sizing:border-box}body{margin:0;background:#f1eee6;color:#263b32;font:16px system-ui}header,main{max-width:1400px;margin:auto;padding:24px}h1{font-size:clamp(32px,5vw,64px);margin:0}main{display:grid;grid-template-columns:minmax(230px,1fr) minmax(0,3fr);gap:24px}aside,label{display:grid;gap:8px}aside{align-content:start}select,input,button{font:inherit;padding:8px;max-width:100%}#preview{background:white;overflow-wrap:anywhere;min-width:0}#headline{font-size:clamp(24px,4vw,44px);line-height:1.2}#metric,#art{font-size:clamp(32px,7vw,88px);line-height:1.15;font-variant-numeric:tabular-nums}#preview p{margin-block:var(--gap)}#art[data-pattern=outline]{color:transparent;-webkit-text-stroke:1px #263b32}#art[data-pattern=negative]{background:#263b32;color:white}#art[data-pattern=spatial]{text-shadow:3px 3px #a0b3a5}#art[data-pattern=mask]{background:repeating-linear-gradient(45deg,#263b32 0 10px,#8ca797 10px 20px);background-clip:text;color:transparent}#art[data-pattern=kinetic]{animation:appear .4s ease-out}@keyframes appear{from{opacity:0}to{opacity:1}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px}a{color:#285b4d}@media(max-width:700px){main{grid-template-columns:1fr}}</style><header><small>INFOGRAPH / VISUAL INTELLIGENCE</small><h1>Typography Studio</h1><p>合成数据 · 字体候选与排版契约，不代表字体已安装。</p></header><main><aside><label>direction<select id="direction"><option selected>editorial</option><option >modernist</option><option >technical</option><option >geometric</option><option >classic</option><option >financial</option><option >poster</option><option >industrial</option></select></label><label>locale<select id="locale"><option selected>mixed</option><option >zh-CN</option><option >zh-HK</option><option >zh-TW</option><option >en</option><option >vi</option><option >th</option><option >km</option><option >my</option><option >ms</option></select></label><label>base<select id="base"><option >12</option><option >14</option><option selected>16</option><option >18</option><option >20</option><option >24</option></select></label><label>leading<select id="leading"><option >1.2</option><option >1.4</option><option selected>1.6</option><option >1.8</option><option >2</option><option >2.2</option></select></label><label>step<select id="step"><option >2</option><option selected>4</option><option >8</option></select></label><label>density<select id="density"><option >compact</option><option selected>normal</option><option >reading</option></select></label><label>precision<select id="precision"><option >0</option><option selected>1</option><option >2</option><option >3</option></select></label><label>pattern<select id="pattern"><option selected>monument</option><option >outline</option><option >mask</option><option >spatial</option><option >kinetic</option><option >encoded</option><option >negative</option></select></label><button id="download">导出 JSON 契约</button><p id="error" role="alert"></p></aside><section><div id="preview"><small>REGIONAL REVIEW / SYNTHETIC</small><h2 id="headline"></h2><div id="metric"></div><p>Actual 326 / Target 320 · million units of currency (illustrative)</p><hr><div id="art" aria-hidden="true"></div><div id="scale" hidden>Coverage 80% <progress value="80" max="100">80%</progress></div><p>Inventory efficiency remains unverified.</p></div><details><summary>设计契约</summary><pre id="contract"></pre></details><details><summary>案例库（10项）</summary><ol id="cases"></ol></details><p>非中文语言仅切换字体候选及数字区域格式，正文不自动翻译。路径文字请参见独立画廊。</p></section></main><script type="module">
import {studioOutput} from "./studio-output.mjs";
import catalog from './typeface-pairs.json' with {type:'json'};
import cases from './typography-cases.json' with {type:'json'};
import {selectPair} from './typeface-pairing.mjs';
import {localePlan} from './multilingual.mjs';
import {formatMetric,attainment} from './numeric-typography.mjs';
import {rhythmPlan,auditRhythm} from './typographic-rhythm.mjs';
import {typeImagePlan} from './type-image.mjs';
function studioPlan(input,catalog){const {direction,locale,base,leading,step,density,precision,pattern}=input;const lang=locale==='mixed'?'zh-CN':locale;const lp=localePlan(lang);const pair=selectPair({direction,locale:['en','zh-CN','mixed'].includes(locale)?locale:'en',dense:density==='compact',available:[]},catalog);if(!['en','zh-CN','mixed'].includes(locale)){pair.heading=lp.family;pair.body=lp.family;pair.missing=[];pair.scope='locale fallback candidate; availability unknown'}const rhythm=rhythmPlan({base,leading,step,density,locale:locale==='en'?'en':'mixed'});const metric=formatMetric(attainment(326,320),{locale:lang,kind:'percent',precision});const art=typeImagePlan({pattern,role:pattern==='monument'?'essential':'decorative',text:pattern==='encoded'?'80%':metric.text,scale:pattern==='encoded'?{min:0,max:100,value:80,unit:'%'}:null});return {version:'1.0',input,pair,locale:lp,rhythm,metric,art,fixture:'synthetic: actual 326, target 320; separate coverage 80%',review:['font availability and license','glyph coverage','browser wrapping and zoom','reader review'],rhythmIssues:auditRhythm(rhythm)}}
const $=id=>document.getElementById(id);const initial={"direction":"editorial","locale":"mixed","base":16,"leading":1.6,"step":4,"density":"normal","precision":1,"pattern":"monument"};let plan;function refresh(){try{const input={};for(const k of Object.keys(initial))input[k]=typeof initial[k]==='number'?Number($(k).value):$(k).value;plan=studioPlan(input,catalog);const p=$('preview');p.lang=plan.locale.lang;p.style.fontFamily=plan.pair.body;p.style.fontSize=plan.rhythm.base+'px';p.style.lineHeight=plan.rhythm.line+'px';p.style.padding='clamp(16px,4vw,48px)';p.style.setProperty('--gap',plan.rhythm.gaps.paragraph+'px');$('headline').style.fontFamily=plan.pair.heading;$('headline').textContent=input.locale==='en'?'Revenue target achieved':input.locale==='zh-CN'||input.locale==='mixed'?'销售目标已经达成':input.locale.startsWith('zh')?'銷售目標已經達成':'Revenue target achieved';$('headline').lang=input.locale.startsWith('zh')||input.locale==='mixed'?plan.locale.lang:'en';$('metric').textContent=plan.metric.text;$('metric').style.fontFamily=plan.pair.heading;$('art').textContent=plan.art.text;$('art').dataset.pattern=input.pattern;$('scale').hidden=input.pattern!=='encoded';$('contract').textContent=JSON.stringify(plan,null,2);$('error').textContent='';$('download').disabled=false}catch(e){plan=null;$('error').textContent=e.message;$('download').disabled=true}}for(const k of Object.keys(initial))$(k).addEventListener('input',refresh);$('download').onclick=()=>{if(!plan)return;const u=URL.createObjectURL(new Blob([JSON.stringify(studioOutput('typography',plan),null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=u;a.download='typography-contract.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};for(const c of cases){const li=document.createElement('li');const a=document.createElement('a');a.href=c.source;a.textContent=c.id+' · '+c.name;li.append(a,document.createTextNode(' — '+c.transfer));$('cases').append(li)}refresh();</script></html>
