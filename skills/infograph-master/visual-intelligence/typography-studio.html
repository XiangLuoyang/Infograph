<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Typography Studio</title><style>*{box-sizing:border-box}body{margin:0;background:#f1eee6;color:#263b32;font:16px system-ui}header,main{max-width:1400px;margin:auto;padding:24px}h1{font-size:clamp(32px,5vw,64px);margin:0}main{display:grid;grid-template-columns:minmax(230px,1fr) minmax(0,3fr);gap:24px}aside,label{display:grid;gap:8px}aside{align-content:start}select,input,button{font:inherit;padding:8px;max-width:100%}#preview{background:white;overflow-wrap:anywhere;min-width:0}#headline{font-size:clamp(24px,4vw,44px);line-height:1.2}#metric,#art{font-size:clamp(32px,7vw,88px);line-height:1.15;font-variant-numeric:tabular-nums}#preview p{margin-block:var(--gap)}#art[data-pattern=outline]{color:transparent;-webkit-text-stroke:1px #263b32}#art[data-pattern=negative]{background:#263b32;color:white}#art[data-pattern=spatial]{text-shadow:3px 3px #a0b3a5}#art[data-pattern=mask]{background:repeating-linear-gradient(45deg,#263b32 0 10px,#8ca797 10px 20px);background-clip:text;color:transparent}#art[data-pattern=kinetic]{animation:appear .4s ease-out}@keyframes appear{from{opacity:0}to{opacity:1}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px}a{color:#285b4d}@media(max-width:700px){main{grid-template-columns:1fr}}</style><header><small>INFOGRAPH / VISUAL INTELLIGENCE</small><h1>Typography Studio</h1><p>合成数据 · 字体候选与排版契约，不代表字体已安装。</p></header><main><aside><label>direction<select id="direction"><option selected>editorial</option><option >modernist</option><option >technical</option><option >geometric</option><option >classic</option><option >financial</option><option >poster</option><option >industrial</option></select></label><label>locale<select id="locale"><option selected>mixed</option><option >zh-CN</option><option >zh-HK</option><option >zh-TW</option><option >en</option><option >vi</option><option >th</option><option >km</option><option >my</option><option >ms</option></select></label><label>base<select id="base"><option >12</option><option >14</option><option selected>16</option><option >18</option><option >20</option><option >24</option></select></label><label>leading<select id="leading"><option >1.2</option><option >1.4</option><option selected>1.6</option><option >1.8</option><option >2</option><option >2.2</option></select></label><label>step<select id="step"><option >2</option><option selected>4</option><option >8</option></select></label><label>density<select id="density"><option >compact</option><option selected>normal</option><option >reading</option></select></label><label>precision<select id="precision"><option >0</option><option selected>1</option><option >2</option><option >3</option></select></label><label>pattern<select id="pattern"><option selected>monument</option><option >outline</option><option >mask</option><option >spatial</option><option >kinetic</option><option >encoded</option><option >negative</option></select></label><button id="download">导出 JSON 契约</button><p id="error" role="alert"></p></aside><section><div id="preview"><small>REGIONAL REVIEW / SYNTHETIC</small><h2 id="headline"></h2><div id="metric"></div><p>Actual 326 / Target 320 · million units of currency (illustrative)</p><hr><div id="art" aria-hidden="true"></div><div id="scale" hidden>Coverage 80% <progress value="80" max="100">80%</progress></div><p>Inventory efficiency remains unverified.</p></div><details><summary>设计契约</summary><pre id="contract"></pre></details><details><summary>案例库（10项）</summary><ol id="cases"></ol></details><p>非中文语言仅切换字体候选及数字区域格式，正文不自动翻译。路径文字请参见独立画廊。</p></section></main><script>function selectPair({direction,locale='mixed',available=[],dense=false},catalog){if(!['en','zh-CN','mixed'].includes(locale)||!Array.isArray(available)||!available.every(x=>typeof x==='string'))throw Error('invalid inputs');const p=catalog.find(x=>x.id===direction);if(!p)throw Error('unknown direction');const latin=locale!=='zh-CN',cjk=locale!=='en';const names=[...(latin?[p.heading,p.body]:[]),...(cjk?[p.cjkHeading,p.cjkBody]:[])];const missing=[...new Set(names)].filter(x=>!available.includes(x));const quote=x=>'"'+x.replace(/["\\]/g,'')+'"';const stack=(a,b,f)=>[...(latin?[quote(a)]:[]),...(cjk?[quote(b),' "Microsoft YaHei"']:[]),f].join(', ');return {id:p.id,heading:stack(dense?p.body:p.heading,dense?p.cjkBody:p.cjkHeading,'system-ui,sans-serif'),body:stack(p.body,p.cjkBody,'system-ui,sans-serif'),missing,review:['glyph coverage','visual weight','baseline','x-height or CJK face proportion','actual wrapping','font license'],scope:'candidate routing; supplied availability is not proof of glyph coverage'}}
const locales={'zh-CN':{family:'"Source Han Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif',strict:true},'zh-TW':{family:'"Source Han Sans TC", "PingFang TC", sans-serif',strict:true},'zh-HK':{family:'"Source Han Sans HC", "PingFang HK", sans-serif',strict:true},en:{family:'system-ui, sans-serif'},vi:{family:'"Noto Sans", system-ui, sans-serif'},th:{family:'"Noto Sans Thai", system-ui, sans-serif'},km:{family:'"Noto Sans Khmer", system-ui, sans-serif'},my:{family:'"Noto Sans Myanmar", system-ui, sans-serif'},ms:{family:'system-ui, sans-serif'}};
function localePlan(locale){const p=locales[locale];if(!Object.hasOwn(locales,locale))throw Error('unsupported locale');return {lang:locale,family:p.family,lineBreak:p.strict?'strict':'auto',wordBreak:'normal',overflowWrap:'break-word',letterSpacing:'normal',lineHeight:['th','km','my'].includes(locale)?1.8:1.6,scope:'candidate CSS; native language review and glyph coverage required'}}
const escape=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function renderRuns(runs){if(!Array.isArray(runs))throw Error('runs required');return runs.map(r=>{if(typeof r.text!=='string'||!Object.hasOwn(locales,r.lang)||!['text','quantity','identifier'].includes(r.role))throw Error('invalid run');return '<span lang="'+r.lang+'" class="ig-run'+(r.role==='text'?'':' ig-atomic')+'">'+escape(r.text)+'</span>'}).join('')}
function auditLines(lines){if(!Array.isArray(lines)||!lines.every(x=>typeof x==='string'))throw Error('lines required');const issues=[];lines.forEach((s,i)=>{if(i>0&&/^[，。！？；：、）》】」』]/u.test(s.trim()))issues.push({line:i+1,kind:'leading punctuation'});if(i<lines.length-1&&/[（《【「『]$/u.test(s.trim()))issues.push({line:i+1,kind:'trailing opener'});if(i<lines.length-1&&/[+−±¥￥$]$/u.test(s.trim())&&/^\d/u.test(lines[i+1].trim()))issues.push({line:i+1,kind:'split quantity'})});return issues}

function formatMetric(value,{locale='zh-CN',unit='',scale=1,precision=1,sign='auto',kind='number',currency}={}){if(!Number.isFinite(scale)||scale<=0||!Number.isInteger(precision)||precision<0||precision>6||!['auto','always','exceptZero'].includes(sign)||!['number','percent','currency'].includes(kind)||typeof unit!=='string')throw Error('invalid format');if(kind==='percent'&&scale!==1)throw Error('percent expects fraction and scale 1');if(kind==='currency'&&(scale!==1||unit))throw Error('currency scaling requires explicit number/unit contract');if(value===null)return {raw:null,text:'—',missing:true,unit};if(!Number.isFinite(value))throw Error('finite number or null required');const n=value/scale;if(!Number.isFinite(n))throw Error('scaled overflow');const options={style:kind==='number'?'decimal':kind,minimumFractionDigits:precision,maximumFractionDigits:precision,signDisplay:sign};if(kind==='currency')options.currency=currency;const fmt=new Intl.NumberFormat(locale,options);const parts=fmt.formatToParts(Object.is(n,-0)?0:n);return {raw:value,text:parts.map(p=>p.value).join('')+(unit?' '+unit:''),parts,unit,scale,precision,missing:false}}
function formatColumn(values,options={}){if(!Array.isArray(values))throw Error('array required');return values.map(v=>formatMetric(v,options))}
function decimalParts(metric){if(metric.missing)return {prefix:'',integer:'—',decimal:'',fraction:'',suffix:''};const p=metric.parts;const first=p.findIndex(x=>x.type==='integer');let last=first;for(let i=first;i<p.length;i++)if(['integer','group','decimal','fraction'].includes(p[i].type))last=i;return {prefix:p.slice(0,first).map(x=>x.value).join(''),integer:p.filter(x=>['integer','group'].includes(x.type)).map(x=>x.value).join(''),decimal:p.find(x=>x.type==='decimal')?.value||'',fraction:p.find(x=>x.type==='fraction')?.value||'',suffix:p.slice(last+1).map(x=>x.value).join('')+(metric.unit?' '+metric.unit:'')}}
function attainment(actual,target){if(actual===null||target===null)return null;if(!Number.isFinite(actual)||!Number.isFinite(target)||target<=0)throw Error('positive target and finite actual required');const v=actual/target;if(!Number.isFinite(v))throw Error('overflow');return v}

function rhythmPlan({base=16,leading=1.6,step=4,density='normal',locale='zh-CN'}={}){if(!Number.isFinite(base)||base<12||base>24||!Number.isFinite(leading)||leading<1.2||leading>2.2||![2,4,8].includes(step)||!['compact','normal','reading'].includes(density)||!['zh-CN','en','mixed'].includes(locale))throw Error('invalid rhythm parameters');const snap=x=>Math.ceil(x/step)*step;const line=snap(base*leading);const factor={compact:.5,normal:1,reading:1.5}[density];const paragraph=snap(line*factor);return {base,line,step,gaps:{inline:step,related:snap(line*.5),paragraph,section:snap(paragraph*2),chapter:snap(paragraph*3)},measure:locale==='en'?'65ch':'36em',scope:'candidate rhythm; not measured line length or baseline alignment'}}
function auditRhythm(p){const issues=[];const g=p.gaps;if(![p.line,...Object.values(g)].every(x=>Number.isFinite(x)&&x>0&&x%p.step===0))issues.push('off-grid or invalid spacing');if(!(g.inline<=g.related&&g.related<=g.paragraph&&g.paragraph<g.section&&g.section<g.chapter))issues.push('hierarchy inversion');return issues}
function rhythmCSS(p){if(auditRhythm(p).length)throw Error('invalid rhythm');return ':root{--ig-line:'+p.line+'px;'+Object.entries(p.gaps).map(([k,v])=>'--ig-gap-'+k+':'+v+'px;').join('')+'} .ig-prose{font-size:'+p.base+'px;line-height:var(--ig-line);max-inline-size:'+p.measure+';overflow-wrap:break-word}.ig-prose p{margin:0}.ig-prose p+p{margin-block-start:var(--ig-gap-paragraph)}.ig-section+.ig-section{margin-block-start:var(--ig-gap-section)}.ig-chapter+.ig-chapter{margin-block-start:var(--ig-gap-chapter)} @media(max-width:600px){.ig-prose{max-inline-size:100%}}'}

function typeImagePlan({pattern,role='decorative',text,scale=null}={}){if(!['monument','outline','mask','path','spatial','kinetic','encoded','negative'].includes(pattern)||!['decorative','essential'].includes(role)||typeof text!=='string'||!text.trim())throw Error('invalid input');if(role==='essential'&&pattern!=='monument'&&pattern!=='encoded')throw Error('decorative treatment cannot be sole essential text');if(pattern==='encoded'&&(!scale||!Number.isFinite(scale.min)||!Number.isFinite(scale.max)||scale.max<=scale.min||!Number.isFinite(scale.value)||scale.value<scale.min||scale.value>scale.max||typeof scale.unit!=='string'||!scale.unit.trim()))throw Error('explicit scale required');return {pattern,role,text,scale,plainEquivalent:text,reducedMotion:'static',fraction:pattern==='encoded'?(scale.value-scale.min)/(scale.max-scale.min):null}}

function studioPlan(input,catalog){const {direction,locale,base,leading,step,density,precision,pattern}=input;const lang=locale==='mixed'?'zh-CN':locale;const lp=localePlan(lang);const pair=selectPair({direction,locale:['en','zh-CN','mixed'].includes(locale)?locale:'en',dense:density==='compact',available:[]},catalog);if(!['en','zh-CN','mixed'].includes(locale)){pair.heading=lp.family;pair.body=lp.family;pair.missing=[];pair.scope='locale fallback candidate; availability unknown'}const rhythm=rhythmPlan({base,leading,step,density,locale:locale==='en'?'en':'mixed'});const metric=formatMetric(attainment(326,320),{locale:lang,kind:'percent',precision});const art=typeImagePlan({pattern,role:pattern==='monument'?'essential':'decorative',text:pattern==='encoded'?'80%':metric.text,scale:pattern==='encoded'?{min:0,max:100,value:80,unit:'%'}:null});return {version:'1.0',input,pair,locale:lp,rhythm,metric,art,fixture:'synthetic: actual 326, target 320; separate coverage 80%',review:['font availability and license','glyph coverage','browser wrapping and zoom','reader review'],rhythmIssues:auditRhythm(rhythm)}}
const $=id=>document.getElementById(id);const catalog=[{"id":"editorial","heading":"Source Serif 4","body":"Source Sans 3","cjkHeading":"Source Han Serif SC","cjkBody":"Source Han Sans SC","strategy":"coordinated-family","status":"candidate; font availability and exact pairing unverified"},{"id":"modernist","heading":"Helvetica Neue","body":"Arial","cjkHeading":"PingFang SC","cjkBody":"PingFang SC","strategy":"single-style","status":"candidate; font availability and exact pairing unverified"},{"id":"technical","heading":"IBM Plex Sans","body":"IBM Plex Mono","cjkHeading":"Source Han Sans SC","cjkBody":"Source Han Sans SC","strategy":"coordinated-family","status":"candidate; font availability and exact pairing unverified"},{"id":"geometric","heading":"Futura","body":"Arial","cjkHeading":"Source Han Sans SC","cjkBody":"Source Han Sans SC","strategy":"deliberate-contrast","status":"candidate; font availability and exact pairing unverified"},{"id":"classic","heading":"Garamond","body":"Source Sans 3","cjkHeading":"Source Han Serif SC","cjkBody":"Source Han Sans SC","strategy":"deliberate-contrast","status":"candidate; font availability and exact pairing unverified"},{"id":"financial","heading":"Georgia","body":"Arial","cjkHeading":"Source Han Serif SC","cjkBody":"Source Han Sans SC","strategy":"deliberate-contrast","status":"candidate; font availability and exact pairing unverified"},{"id":"poster","heading":"Bodoni Moda","body":"Source Sans 3","cjkHeading":"Source Han Serif SC","cjkBody":"Source Han Sans SC","strategy":"deliberate-contrast","status":"candidate; font availability and exact pairing unverified"},{"id":"industrial","heading":"Roboto Slab","body":"Roboto","cjkHeading":"Source Han Sans SC","cjkBody":"Source Han Sans SC","strategy":"deliberate-contrast","status":"candidate; font availability and exact pairing unverified"}];const cases=[
  {

];const initial={"direction":"editorial","locale":"mixed","base":16,"leading":1.6,"step":4,"density":"normal","precision":1,"pattern":"monument"};let plan;function refresh(){try{const input={};for(const k of Object.keys(initial))input[k]=typeof initial[k]==='number'?Number($(k).value):$(k).value;plan=studioPlan(input,catalog);const p=$('preview');p.lang=plan.locale.lang;p.style.fontFamily=plan.pair.body;p.style.fontSize=plan.rhythm.base+'px';p.style.lineHeight=plan.rhythm.line+'px';p.style.padding='clamp(16px,4vw,48px)';p.style.setProperty('--gap',plan.rhythm.gaps.paragraph+'px');$('headline').style.fontFamily=plan.pair.heading;$('headline').textContent=input.locale==='en'?'Revenue target achieved':input.locale==='zh-CN'||input.locale==='mixed'?'销售目标已经达成':input.locale.startsWith('zh')?'銷售目標已經達成':'Revenue target achieved';$('headline').lang=input.locale.startsWith('zh')||input.locale==='mixed'?plan.locale.lang:'en';$('metric').textContent=plan.metric.text;$('metric').style.fontFamily=plan.pair.heading;$('art').textContent=plan.art.text;$('art').dataset.pattern=input.pattern;$('scale').hidden=input.pattern!=='encoded';$('contract').textContent=JSON.stringify(plan,null,2);$('error').textContent='';$('download').disabled=false}catch(e){plan=null;$('error').textContent=e.message;$('download').disabled=true}}for(const k of Object.keys(initial))$(k).addEventListener('input',refresh);$('download').onclick=()=>{if(!plan)return;const u=URL.createObjectURL(new Blob([JSON.stringify(plan,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=u;a.download='typography-contract.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};for(const c of cases){const li=document.createElement('li');const a=document.createElement('a');a.href=c.source;a.textContent=c.id+' · '+c.name;li.append(a,document.createTextNode(' — '+c.transfer));$('cases').append(li)}refresh();</script></html>
